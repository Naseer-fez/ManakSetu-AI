# Regex patterns that detect prompt injection or role-hijacking attempts.
# Matched case-insensitively against the full query string.
blocked_patterns:
  - "ignore\\s+(previous|above|prior|all)\\s+(instructions?|rules?|prompts?)"
  - "forget\\s+(your|all|previous|prior)\\s+(instructions?|rules?|training)"
  - "pretend\\s+(you\\s+are|to\\s+be|you're)"
  - "act\\s+as\\s+(if|a|an|the)"
  - "new\\s+instructions?"
  - "override\\s+(your|system|previous)"
  - "you\\s+are\\s+now\\s+a"
  - "disregard\\s+(previous|all|above|prior)"
  - "system\\s*:\\s*you"
  - "\\bDAN\\b"
  - "jailbreak"
  - "bypass\\s+(filter|guard|restriction|safety)"
  - "do\\s+anything\\s+now"
  - "roleplay\\s+as"
