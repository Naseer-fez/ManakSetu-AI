# Web Search Guardrail Configuration
# Controls which queries are allowed through the web search tool.
# All lists are case-insensitive during matching.

allowed_domains:
  - "bis.gov.in"
  - "services.bis.gov.in"
  - "gem.gov.in"
  - "eprocure.gov.in"
  - "standardsbis.bsbedge.com"
  - "manakonline.in"
  - "dgft.gov.in"
  - "dpiit.gov.in"
  - "steel.gov.in"
  - "meity.gov.in"
  - "bee.gov.in"
  - "consumeraffairs.nic.in"

