server:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

storage:
  data_dir: "backend/data"
  standards_file: "backend/data/standards_database.json"
  qco_file: "backend/data/qco_registry.json"
  upload_dir: "backend/data/uploads"

ai_engine:
  embedding_model_name: "llm/paraphrase-multilingual-MiniLM-L12-v2"
  multilingual_model_name: "llm/paraphrase-multilingual-MiniLM-L12-v2"
  similarity_threshold: 0.35
  min_relevance_score: 0.35
  top_k_recommendations: 5
  hybrid_alpha: 0.65
  enable_gpu: true
  require_cuda: true
  gpu_device: "cuda:0"
  reranker_model: "llm/bge-reranker-small"
  reranker_candidate_pool: 25
  domain_expansions_file: "backend/config/domain_expansions.yaml"

llm:
  provider: "local_gguf"
  model_name: "Qwen2.5-7B-Instruct-Q4_K_M"
  model_path: "llm/Qwen2.5-7B-Instruct-Q4_K_M.gguf"
  n_ctx: 32768
  n_threads: 4
  n_gpu_layers: 18
  chat_format: "chatml"
  api_key_env_var: "GEMINI_API_KEY"
  openrouter_api_key_env_var: "OPENROUTER_API_KEY"
  temperature: 0.2
  max_tokens: 2048
  enable_grammar: true
  grammar_file: "backend/engine/grammars/bis_output.gbnf"
  repeat_penalty: 1.18
  frequency_penalty: 0.1
  presence_penalty: 0.1
  repeat_last_n: 256
  top_p: 0.9
  max_queue_size: 5

cache:
  sqlite_db_path: "backend/data/semantic_cache.db"
  similarity_threshold: 0.95

voice:
  stt_provider: "faster_whisper"
  stt_model_path: "llm/faster-whisper-tiny"
  stt_device: "cpu"
  stt_compute_type: "int8"
  stt_task: "transcribe"
  stt_initial_prompt: "BIS Bureau of Indian Standards voice conversation. Hello, Hi."
  tts_provider: "mms_vits"
  tts_eng_model_path: "llm/mms-tts-eng"
  tts_hin_model_path: "llm/mms-tts-hin"
  tts_device: "cpu"
  default_language: "auto"
  max_audio_duration_sec: 60
  audio_sample_rate: 16000
  tts_cache_dir: "backend/data/tts_cache"
  live_enabled: true
  live_max_turns: 5
  live_sentence_delimiters: ".!?"

bis_scraper:
  base_url: "https://www.services.bis.gov.in/php/BIS_2.0/bisconnect/knowyourstandards/indian_standards/isdetails"
  qco_portal_url: "https://www.bis.gov.in/product-certification/products-under-compulsory-certification/"
  request_timeout_sec: 15
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

logging:
  log_dir: "backend/logs"
  log_file: "backend/logs/backend.log"
  level: "INFO"
  rotation_max_bytes: 10485760
  backup_count: 5

vector_database:
  active_db: "local" # Options: "local" or "source"
  final_db_path: "vectordb/data/chroma"
  old_db_1_path: "vectordb"
  old_db_2_path: "vectordb"
  bis_data_path: "backend/data"
  collection_name: "bis_standards_collection"

distributed_reasoning:
  mac_available: true
  mac_endpoint: "http://10.118.237.94:5008/reason"
  local_preprocessor_model: "llm/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
  fast_model_n_ctx: 16384
  thinking_model_n_ctx: 16384
  fast_model_n_gpu_layers: 36
  fast_model_kv_quant: "q8_0"
  fast_model_rope_freq_scale: 1.0
  mac_timeout_sec: 25.0

web_search:
  enabled: true
  provider: "duckduckgo"
  request_timeout_sec: 15
  fast_answer_top_k: 2
  fast_answer_max_tokens: 300
  heavy_reasoning_top_k: 3
  heavy_reasoning_max_tokens: 500
  cache_ttl_hours: 24
  guardrail_config: "backend/config/web_search_domains.yaml"
